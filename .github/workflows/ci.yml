name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_PASSWORD: ci_app_password
          REDIS_PASSWORD: ci_redis_password
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: docker compose --env-file .env.example -f infra/docker-compose.yml config --quiet
      - name: Validate Nginx gateway configuration
        run: docker run --rm --add-host auth-service:127.0.0.1 --add-host train-service:127.0.0.1 --add-host booking-service:127.0.0.1 --add-host notification-service:127.0.0.1 -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.28-alpine nginx -t
