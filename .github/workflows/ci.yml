name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp clean verify
      - name: Summarize aggregate JaCoCo coverage
        run: |
          python - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          report = pathlib.Path('backend/coverage-report/target/site/jacoco-aggregate/jacoco.xml')
          if not report.exists():
              print(f'JaCoCo aggregate XML not found: {report}', file=sys.stderr)
              sys.exit(1)
          root = ET.parse(report).getroot()
          totals = {counter.attrib['type']: (int(counter.attrib['covered']), int(counter.attrib['missed'])) for counter in root.findall('counter')}
          for kind in ('INSTRUCTION', 'BRANCH', 'LINE', 'METHOD', 'CLASS'):
              covered, missed = totals.get(kind, (0, 0))
              total = covered + missed
              percent = (covered * 100 / total) if total else 100.0
              print(f'{kind}: {percent:.2f}% ({covered}/{total})')
          lines = ['## JaCoCo aggregate coverage', '']
          for kind in ('INSTRUCTION', 'BRANCH', 'LINE', 'METHOD', 'CLASS'):
              covered, missed = totals.get(kind, (0, 0))
              total = covered + missed
              percent = (covered * 100 / total) if total else 100.0
              lines.append(f'- **{kind.title()} coverage:** {percent:.2f}% ({covered}/{total})')
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\\n'.join(lines) + '\\n')
          minimums = {'LINE': 15.0, 'BRANCH': 15.0, 'CLASS': 20.0}
          failures = []
          for kind, minimum in minimums.items():
              covered, missed = totals.get(kind, (0, 0))
              total = covered + missed
              percent = (covered * 100 / total) if total else 100.0
              if percent < minimum:
                  failures.append(f'{kind} coverage {percent:.2f}% is below required {minimum:.2f}%')
          if failures:
              print('Coverage quality gate failed: ' + '; '.join(failures), file=sys.stderr)
              sys.exit(1)
          PY
      - name: Publish JaCoCo and Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railreserve-test-and-coverage-reports
          path: |
            **/target/site/jacoco/**
            backend/coverage-report/target/site/jacoco-aggregate/**
            **/target/surefire-reports/*.xml
          if-no-files-found: warn
          retention-days: 14
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_PASSWORD: ci_app_password
          REDIS_PASSWORD: ci_redis_password
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: docker compose --env-file .env.example -f infra/docker-compose.yml config --quiet
      - name: Validate Nginx gateway configuration
        run: docker run --rm --add-host auth-service:127.0.0.1 --add-host train-service:127.0.0.1 --add-host booking-service:127.0.0.1 --add-host notification-service:127.0.0.1 -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.28-alpine nginx -t

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated smoke-test secrets
        run: |
          mkdir -p infra/secrets
          openssl genpkey -algorithm RSA -out infra/secrets/railreserve-private.pem -pkeyopt rsa_keygen_bits:3072
          openssl pkey -in infra/secrets/railreserve-private.pem -pubout -out infra/secrets/railreserve-public.pem
          # This key is disposable and exists only inside the ephemeral CI runner.
          # The non-root container user must be able to read the mounted test key.
          chmod 644 infra/secrets/railreserve-private.pem
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci_root_password
          MYSQL_USER=railreserve_app
          MYSQL_PASSWORD=ci_app_password
          REDIS_PASSWORD=ci_redis_password
          CORS_ALLOWED_ORIGINS=http://localhost:5173
          PAYMENT_ENABLED=false
          EOF
      - name: Build and start full Compose stack, apply Flyway migrations, and wait for service health
        run: |
          set -eu
          cleanup() {
            docker compose --env-file .env -f infra/docker-compose.yml logs --no-color || true
            docker compose --env-file .env -f infra/docker-compose.yml down -v --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose --env-file .env -f infra/docker-compose.yml up -d --build
          for attempt in $(seq 1 120); do
            if [ -n "$(docker compose --env-file .env -f infra/docker-compose.yml ps --status exited -q)" ]; then
              echo "A Compose service exited before health checks passed." >&2
              docker compose --env-file .env -f infra/docker-compose.yml ps
              exit 1
            fi
            if curl --silent --fail http://localhost:8080/health/auth >/dev/null &&
               curl --silent --fail http://localhost:8080/health/train >/dev/null &&
               curl --silent --fail http://localhost:8080/health/booking >/dev/null &&
               curl --silent --fail http://localhost:8080/health/notification >/dev/null; then
              echo "All four services are healthy behind the gateway."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for all RailReserve services to become healthy." >&2
          exit 1
