server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: railreserve-notifications
      enable-auto-commit: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
