services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in root .env}
      MYSQL_USER: ${MYSQL_USER:-railreserve_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in root .env}
    ports: ["127.0.0.1:3306:3306"]
    volumes: [mysql_data:/var/lib/mysql, ./mysql/init:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in root .env}"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports: ["127.0.0.1:29092:29092"]
  auth-service:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: auth-service
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/railreserve_auth?serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-railreserve_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in root .env}
    depends_on:
      mysql:
        condition: service_healthy
    ports: ["127.0.0.1:8081:8081"]
  train-service:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: train-service
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/railreserve_train?serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-railreserve_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in root .env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in root .env}
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
    ports: ["127.0.0.1:8082:8082"]
  booking-service:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: booking-service
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://mysql:3306/railreserve_booking?serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-railreserve_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in root .env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in root .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
    ports: ["127.0.0.1:8083:8083"]
  notification-service:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: notification-service
    environment:
      SERVER_PORT: 8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_started
    ports: ["127.0.0.1:8084:8084"]
volumes:
  mysql_data:
  redis_data:
