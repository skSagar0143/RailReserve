services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in root .env}
      MYSQL_USER: ${MYSQL_USER:-railreserve_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in root .env}
    ports: ["127.0.0.1:3306:3306"]
    volumes: [mysql_data:/var/lib/mysql, ./mysql/init:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in root .env}"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?Set REDIS_PASSWORD in root .env} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports: ["127.0.0.1:29092:29092"]
  auth-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: auth-service
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/railreserve_auth?serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-railreserve_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in root .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in root .env}
      RSA_PRIVATE_KEY_PATH: /run/secrets/railreserve-private.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      RSA_PUBLIC_KEY_PATH: /run/secrets/railreserve-public.pem
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
    volumes:
      - ./secrets/railreserve-private.pem:/run/secrets/railreserve-private.pem:ro
      - ./secrets/railreserve-public.pem:/run/secrets/railreserve-public.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["127.0.0.1:8081:8081"]
  train-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: train-service
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/railreserve_train?serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-railreserve_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in root .env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in root .env}
      RSA_PUBLIC_KEY_PATH: /run/secrets/railreserve-public.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - ./secrets/railreserve-public.pem:/run/secrets/railreserve-public.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["127.0.0.1:8082:8082"]
  booking-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: booking-service
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://mysql:3306/railreserve_booking?serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-railreserve_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in root .env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in root .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RSA_PUBLIC_KEY_PATH: /run/secrets/railreserve-public.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      PAYMENT_ENABLED: ${PAYMENT_ENABLED:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-http://localhost:5173/payment-result}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-INR}
    volumes:
      - ./secrets/railreserve-public.pem:/run/secrets/railreserve-public.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports: ["127.0.0.1:8083:8083"]
  notification-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: notification-service
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:mysql://mysql:3306/railreserve_notification?serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-railreserve_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in root .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RSA_PUBLIC_KEY_PATH: /run/secrets/railreserve-public.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - ./secrets/railreserve-public.pem:/run/secrets/railreserve-public.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    ports: ["127.0.0.1:8084:8084"]
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      auth-service:
        condition: service_started
      train-service:
        condition: service_started
      booking-service:
        condition: service_started
      notification-service:
        condition: service_started
volumes:
  mysql_data:
  redis_data:
