server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    location = /health/auth {
        proxy_pass http://auth-service:8081/api/v1/health;
    }
    location = /health/train {
        proxy_pass http://train-service:8082/api/v1/health;
    }
    location = /health/booking {
        proxy_pass http://booking-service:8083/api/v1/health;
    }
    location = /health/notification {
        proxy_pass http://notification-service:8084/api/v1/health;
    }

    location /api/v1/auth/ {
        proxy_pass http://auth-service:8081;
    }
    location = /api/v1/stations {
        proxy_pass http://train-service:8082;
    }
    location /api/v1/trains/ {
        proxy_pass http://train-service:8082;
    }
    location /api/v1/admin/inventory {
        proxy_pass http://booking-service:8083;
    }
    location /api/v1/bookings {
        proxy_pass http://booking-service:8083;
    }
    location /api/v1/admin/ {
        proxy_pass http://train-service:8082;
    }

    location / {
        return 404;
    }
}
